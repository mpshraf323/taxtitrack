<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Taxi Track - Book Trip</title>

  <!-- Icons + Fonts -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            roboto: ['Roboto', 'sans-serif'],
          },
        },
      },
    }
  </script>

  <!-- Floating Label Fix -->
  <style>
    .float-label input:focus + label,
    .float-label input:not(:placeholder-shown) + label,
    .float-label select:focus + label,
    .float-label select:not([value=""]) + label {
      @apply text-xs -top-2 left-10 bg-white px-1 text-yellow-600;
    }
  </style>
</head>

<body class="bg-gray-100 pb-24 font-roboto">

  <!-- PAGE HEADER -->
  <div class="p-5 bg-yellow-500 text-white rounded-b-3xl shadow">
    <h1 class="text-xl font-semibold">Book a Trip</h1>
    <p class="text-sm opacity-90">Fill the details to schedule a new trip</p>
  </div>

  <!-- FORM SECTION -->
  <div class="p-5 space-y-5">

    <!-- CUSTOMER -->
    <div class="float-label relative">
      <span class="material-symbols-rounded absolute top-3 left-3 text-gray-400">person</span>

      <select value=""
        class="w-full pl-12 p-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-yellow-500 outline-none bg-white">
        <option value="" disabled selected></option>
        <option>Customer 1</option>
        <option>Customer 2</option>
      </select>

      <label class="absolute text-gray-500 top-3 left-12 transition-all duration-200 pointer-events-none">
        Customer
      </label>
    </div>

    <!-- PICKUP LOCATION -->
    <div class="float-label relative">
      <span class="material-symbols-rounded absolute top-3 left-3 text-gray-400">my_location</span>

      <input type="text" placeholder="Pick Up Location"
        class="w-full pl-12 p-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-yellow-500 outline-none bg-white" />
    </div>

    <!-- DROP LOCATION -->
    <div class="float-label relative">
      <span class="material-symbols-rounded absolute top-3 left-3 text-gray-400">location_on</span>

      <input type="text" placeholder="Drop Location"
        class="w-full pl-12 p-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-yellow-500 outline-none bg-white" />

     
    </div>

    <!-- DATE TIME -->
    <div class="float-label relative">
      <span class="material-symbols-rounded absolute top-3 left-3 text-gray-400">event</span>

      <input type="datetime-local" placeholder="Pickup Date & Time"
        class="w-full pl-12 p-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-yellow-500 outline-none bg-white" />

  
    </div>

    <!-- TOTAL KM -->
    <div class="float-label relative">
      <span class="material-symbols-rounded absolute top-3 left-3 text-gray-400">distance</span>

      <input type="number" placeholder="Total Kilometers"
        class="w-full pl-12 p-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-yellow-500 outline-none bg-white" />

    </div>

    <!-- AMOUNT -->
    <div class="float-label relative">
    <span class="material-symbols-rounded absolute top-3 left-3 text-gray-400">payments</span>

      <input type="number" placeholder="Total Price"
        class="w-full pl-12 p-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-yellow-500 outline-none bg-white" />


    </div>

    <!-- NOTES -->
    <div class="float-label relative">
      <span class="material-symbols-rounded absolute top-3 left-3 text-gray-400">notes</span>

      <input type="text" placeholder=" "
        class="w-full pl-12 p-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-yellow-500 outline-none bg-white" />

      <label class="absolute text-gray-500 top-3 left-12 transition-all duration-200 pointer-events-none">
        Notes
      </label>
    </div>

    <!-- RECURSIVE -->
    <div class="flex items-center space-x-2">
      <input type="checkbox" id="recursive" class="w-4 h-4 accent-yellow-500" />
      <label for="recursive" class="text-gray-700 text-sm">Is this trip recursive?</label>
    </div>

    <!-- BUTTON -->
    <button class="w-full mt-4 bg-yellow-500 text-white p-4 rounded-2xl text-lg font-semibold shadow-md active:scale-95 transition">
      Schedule Now
    </button>

  </div>

  <!-- BOTTOM NAV -->
  <div class="fixed bottom-0 left-0 right-0 bg-white shadow-lg rounded-t-3xl p-3 flex justify-around">

 <a href="dashboard.html" class="flex flex-col items-center text-blue-500">
    <span class="material-symbols-rounded text-2xl">home</span>
    <p class="text-xs">Home</p>
 </a>

<a href="trips.html" class="flex flex-col items-center text-blue-500">
  <span class="material-symbols-rounded text-2xl">calendar_month</span>
  <p class="text-xs">Trips</p>
</a>

    <div class="flex flex-col items-center text-gray-500">
      <span class="material-symbols-rounded text-2xl">account_balance_wallet</span>
      <p class="text-xs">Payments</p>
    </div>

    <div class="flex flex-col items-center text-gray-500">
      <span class="material-symbols-rounded text-2xl">person</span>
      <p class="text-xs">Profile</p>
    </div>

  </div>

</body>
</html>
