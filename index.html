<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Taxi Track</title>

  <!-- TailwindCSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
   body {
      background-image: url('https://img.freepik.com/free-vector/abstract-simple-yellow-circle-shape-background-design-vector_1017-47338.jpg?semt=ais_hybrid&w=740&q=80');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }
  </style>
</head>
<body class="h-screen flex items-center justify-center px-6">

  <div class="w-full max-w-xs mx-auto">

    <!-- Logo + Title -->
    <div class="flex items-center space-x-2 mt-6">
      <h1 class="text-black text-lg font-semibold">Calibre Taxi Track</h1>
    </div>

    <!-- Heading -->
    <h2 class="text-3xl font-bold text-white mt-8">Let's get started</h2>
    <p class="text-white mt-2">Sign up or login to see what’s happening near you</p>

    <!-- Car Image -->
    <div class="mt-8">
      <img src="https://images.jdmagicbox.com/quickquotes/images_main/punch-accomplished-plus-camo-cng-seaweed-green-with-white-roof-272966442-8lyd6.png" 
           alt="car" 
           class="w-full drop-shadow-xl" />
    </div>

    <!-- Buttons Section -->
    <div class="space-y-4 mt-10">

      <!-- Email Button -->
 <a href="login.html" 
   class="w-full block text-center bg-white text-black py-3 rounded-xl font-semibold shadow">
  Login Now
</a>

      <!-- Google Button -->
      <button class="w-full bg-white text-black py-3 rounded-xl flex items-center justify-center space-x-3 shadow">
        <img src="https://www.svgrepo.com/show/355037/google.svg" class="w-5 h-5" />
        <span>Continue with Google</span>
      </button>


    </div>

  </div>

</body>
</html>
