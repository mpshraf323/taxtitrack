<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Taxi Track</title>

  <!-- TailwindCSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
   body {
      background-image: url('https://img.freepik.com/free-vector/abstract-simple-yellow-circle-shape-background-design-vector_1017-47338.jpg?semt=ais_hybrid&w=740&q=80');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }
  </style>
</head>

<body class="h-screen flex items-center justify-center px-6">

  <div class="w-full max-w-xs mx-auto">

    <!-- Logo + Title -->
    <div class="flex items-center space-x-2 mt-6">
      <h1 class="text-black text-lg font-semibold">Calibre Taxi Track</h1>
    </div>

    <!-- Heading -->
    <h2 class="text-3xl font-bold text-white mt-8">Login</h2>
    <p class="text-white mt-2">Please enter your login details</p>

    <!-- Car Image -->
   <div class="mt-2">
      <img src="taxi.png" 
           alt="car" 
           class="w-full drop-shadow-xl" />
    </div>

    <!-- Login Form -->
    <form class="mt-10 space-y-4">

      <!-- Username Input -->
      <input
        type="text"
        placeholder="Username"
        class="w-full px-4 py-3 rounded-xl bg-white/90 focus:outline-none shadow text-black"
      />

      <!-- Password Input -->
      <input
        type="password"
        placeholder="Password"
        class="w-full px-4 py-3 rounded-xl bg-white/90 focus:outline-none shadow text-black"
      />

   <!-- Login Button -->
<a href="dashboard.html" 
   class="w-full block text-center bg-black text-white py-3 rounded-xl font-semibold shadow">
  Login Now
</a>

    </form>

  </div>

</body>
</html>
