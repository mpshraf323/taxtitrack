<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Taxi Track - Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
   <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            roboto: ['Roboto', 'sans-serif'],
          },
        },
      },
    }
  </script>
</head>

<body class="bg-gray-100 ">
  <div class="min-h-screen flex items-center justify-center p-5">

    <div class="w-full max-w-sm bg-white rounded-2xl shadow-xl p-6">
      
      <!-- App Logo / Title -->
      <h1 class="text-3xl font-bold text-center text-yellow-500 mb-6">Taxi Track</h1>

      <!-- Username Input -->
      <div class="mb-4">
        <label class="block mb-1 font-medium text-gray-700">Username</label>
        <input 
          type="text" 
          placeholder="Enter your username"
          class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:border-yellow-500 focus:ring-2 
                 focus:ring-yellow-400 transition outline-none"
        />
      </div>

      <!-- Password Input -->
      <div class="mb-6">
        <label class="block mb-1 font-medium text-gray-700">Password</label>
        <input 
          type="password" 
          placeholder="Enter your password"
          class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:border-yellow-500 focus:ring-2 
                 focus:ring-yellow-400 transition outline-none"
        />
      </div>

      <!-- Login Button -->
    <a href="dashboard.html">
  <button 
    class="w-full bg-yellow-500 text-white py-3 rounded-xl font-semibold text-lg
           hover:bg-yellow-600 transition-all shadow-md">
    Login
  </button>
</a>

      <!-- Additional Options -->
      <p class="text-center text-gray-500 mt-4 text-sm">
        Forgot password?
      </p>
    </div>

  </div>
</body>
</html>
